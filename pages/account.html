<!doctype html><html lang="fr"><head><title>Mon compte - DT Job Board</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2322252A%27/%3E%3Crect x=%275%27 y=%2722%27 width=%2711%27 height=%274%27 fill=%27%233E5C50%27/%3E%3C/svg%3E"><link rel="stylesheet" href="/static/css/style.css"></head><body>
<header class="top"><a class="brand" href="/"><span class="dt">DT</span> Job Board</a><nav id="nav" aria-label="Compte"></nav></header>
<main class="narrow"><h1 class="page-title">Mon compte</h1>
<form class="card-form" data-mode="account" novalidate>
 <div class="row"><label>Prénom<input name="first_name" required></label>
 <label>Nom<input name="last_name" required></label></div>
 <label>E-mail<input name="email" type="email" required></label>
 <label>Téléphone<input name="phone" type="tel"></label>
 <label>Nouveau mot de passe (laisser vide pour conserver l'actuel)<input name="password" type="password" minlength="8" autocomplete="new-password"></label>
 <button class="btn solid">Enregistrer</button><p class="msg" role="status"></p>
</form>
<section class="mine" aria-labelledby="mine-title"><h2 id="mine-title">Mes candidatures</h2><div id="mine" aria-live="polite"><p class="hint">Chargement...</p></div></section></main>
<footer class="foot"><span>DT Job Board</span><a href="/">Toutes les offres</a></footer>
<script src="/static/js/common.js"></script><script src="/static/js/auth.js"></script>
</body></html>
