<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-5"><h1>Connexion</h1><form id="f" style="max-width:500px"><input class="form-control my-2" name="email" type="email" placeholder="Email" required><input class="form-control my-2" name="password" type="password" placeholder="Mot de passe" required><button class="btn btn-primary">Se connecter</button></form><p id="m"></p><a href="register.html">Créer un compte</a><script src="auth.js"></script><script>const f=document.getElementById('f'),m=document.getElementById('m');f.onsubmit=async e=>{e.preventDefault();try{const r=await fetch(`${API_URL}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.email.value,password:f.password.value})}),d=await r.json();if(!r.ok)throw Error(d.error);saveSession(d);location.href=d.user.role==='admin'?'admin.html':'index.html'}catch(e){m.textContent=e.message;m.className='text-danger'}}</script></body></html>
