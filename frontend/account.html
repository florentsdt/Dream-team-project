<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon compte</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-5"><h1>Mon compte</h1><form id="f" style="max-width:500px"><input class="form-control my-2" name="first_name" required><input class="form-control my-2" name="last_name" required><input class="form-control my-2" name="email" disabled><input class="form-control my-2" name="phone"><button class="btn btn-primary">Enregistrer</button> <button class="btn btn-outline-danger" id="out" type="button">Déconnexion</button></form><p id="m"></p><script src="auth.js"></script><script>const t=localStorage.getItem('token'),f=document.getElementById('f'),m=document.getElementById('m');if(!t)location.href='login.html';async function load(){try{const r=await fetch(`${API_URL}/auth/me`,{headers:{Authorization:`Bearer ${t}`}}),d=await r.json();if(!r.ok)throw Error(d.error);f.first_name.value=d.user.first_name;f.last_name.value=d.user.last_name;f.email.value=d.user.email;f.phone.value=d.user.phone||''}catch(e){m.textContent=e.message}}f.onsubmit=async e=>{e.preventDefault();try{const r=await fetch(`${API_URL}/auth/me`,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify({first_name:f.first_name.value,last_name:f.last_name.value,phone:f.phone.value})}),d=await r.json();if(!r.ok)throw Error(d.error);m.textContent='Compte modifié';m.className='text-success'}catch(e){m.textContent=e.message;m.className='text-danger'}};document.getElementById('out').onclick=logout;load()</script></body></html>
