<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-5"><h1>Administration</h1><button id="out" class="btn btn-outline-danger">Déconnexion</button><h2 class="mt-4">Créer une annonce</h2><form id="f" class="mb-4"><input class="form-control my-2" name="title" placeholder="Titre" required><input class="form-control my-2" name="short_description" placeholder="Description courte" required><textarea class="form-control my-2" name="full_description" placeholder="Description complète" required></textarea><input class="form-control my-2" name="salary_min" type="number" placeholder="Salaire min"><input class="form-control my-2" name="salary_max" type="number" placeholder="Salaire max"><input class="form-control my-2" name="location" placeholder="Lieu"><select class="form-select my-2" name="contract_type"><option value="CDI">CDI</option><option value="CDD">CDD</option><option value="internship">Stage</option><option value="apprenticeship">Apprentissage</option><option value="freelance">Freelance</option></select><select class="form-select my-2" name="working_time"><option value="full_time">Temps plein</option><option value="part_time">Temps partiel</option></select><input class="form-control my-2" name="company_id" type="number" placeholder="ID entreprise (1 ou 2)" required><input class="form-control my-2" name="category_id" type="number" placeholder="ID catégorie (1, 2 ou 3)" required><button class="btn btn-primary">Créer</button></form><p id="m"></p><div id="list" class="list-group"></div><script src="auth.js"></script><script>const t=localStorage.getItem('token'),u=getStoredUser(),f=document.getElementById('f'),m=document.getElementById('m'),list=document.getElementById('list');if(!t||!u||u.role!=='admin')location.href='login.html';document.getElementById('out').onclick=logout;async function load(){try{const r=await fetch(`${API_URL}/admin/ads`,{headers:{Authorization:`Bearer ${t}`}}),d=await r.json();if(!r.ok)throw Error(d.error);list.innerHTML='';d.forEach(a=>{const row=document.createElement('div');row.className='list-group-item d-flex justify-content-between';const s=document.createElement('span');s.textContent=`${a.id} — ${a.title}`;const b=document.createElement('button');b.className='btn btn-danger btn-sm';b.textContent='Supprimer';b.dataset.id=a.id;row.append(s,b);list.append(row)})}catch(e){m.textContent=e.message}}f.onsubmit=async e=>{e.preventDefault();try{const body={title:f.title.value,short_description:f.short_description.value,full_description:f.full_description.value,salary_min:f.salary_min.value?Number(f.salary_min.value):null,salary_max:f.salary_max.value?Number(f.salary_max.value):null,location:f.location.value,contract_type:f.contract_type.value,working_time:f.working_time.value,company_id:Number(f.company_id.value),category_id:Number(f.category_id.value)},r=await fetch(`${API_URL}/admin/ads`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${t}`},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);m.textContent='Annonce créée';f.reset();load()}catch(e){m.textContent=e.message}};list.onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b||!confirm('Supprimer cette annonce ?'))return;try{const r=await fetch(`${API_URL}/admin/ads/${b.dataset.id}`,{method:'DELETE',headers:{Authorization:`Bearer ${t}`}}),d=await r.json();if(!r.ok)throw Error(d.error);m.textContent='Annonce supprimée';load()}catch(e){m.textContent=e.message}};load()</script></body></html>
