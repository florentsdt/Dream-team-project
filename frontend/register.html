<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-5"><h1>Créer un compte</h1><form id="f" style="max-width:500px"><input class="form-control my-2" name="first_name" placeholder="Prénom" required><input class="form-control my-2" name="last_name" placeholder="Nom" required><input class="form-control my-2" name="email" type="email" placeholder="Email" required><input class="form-control my-2" name="phone" placeholder="Téléphone"><input class="form-control my-2" name="password" type="password" minlength="8" placeholder="Mot de passe (8 caractères minimum)" required><button class="btn btn-primary">Créer mon compte</button></form><p id="m"></p><a href="login.html">Déjà inscrit ? Connexion</a><script src="auth.js"></script><script>const f=document.getElementById('f'),m=document.getElementById('m');f.onsubmit=async e=>{e.preventDefault();try{const r=await fetch(`${API_URL}/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({first_name:f.first_name.value,last_name:f.last_name.value,email:f.email.value,phone:f.phone.value,password:f.password.value})}),d=await r.json();if(!r.ok)throw Error(d.error);saveSession(d);location.href='index.html'}catch(e){m.textContent=e.message;m.className='text-danger'}}</script></body></html>
